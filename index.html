<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DQX 戦神のベルト検索ツール スマホ対応版</title>
<style>
:root{--bg:#0f172a;--card:#111827;--text:#e5e7eb;--muted:#94a3b8;--line:#334155;--accent:#38bdf8;--ok:#86efac;--warn:#fde68a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(160deg,#07111f,#172554);color:var(--text);font-size:16px}header,.wrap{max-width:1120px;margin:auto;padding:16px}h1{font-size:24px;margin:8px 0}h2{font-size:19px;margin:8px 0 12px}.note,p{color:var(--muted);line-height:1.55}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px;position:sticky;top:0;background:rgba(15,23,42,.96);z-index:5}.grid{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:880px){.grid{grid-template-columns:1fr 1fr}}.card{background:rgba(17,24,39,.95);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 16px 40px rgba(0,0,0,.25)}textarea,input,select{width:100%;font-size:16px;color:var(--text);background:#020617;border:1px solid #475569;border-radius:12px;padding:12px;line-height:1.45}textarea{min-height:260px;resize:vertical}button{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;background:var(--accent);color:#00111a;font-weight:700;font-size:16px;padding:12px 16px;margin:4px 4px 4px 0;min-height:44px;cursor:pointer;touch-action:manipulation}button.secondary{background:#334155;color:var(--text)}button.active{background:#e0f2fe;color:#00111a}.hidden{display:none}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.boss{border-top:1px solid var(--line);padding:12px 0}.boss:first-child{border-top:0}.pill,.tag{display:inline-block;border:1px solid #475569;border-radius:999px;padding:3px 8px;margin:2px;color:#cbd5e1;font-size:12px}.hit{border-color:#22c55e;color:#bbf7d0}.maybe{border-color:#eab308;color:var(--warn)}.score{font-weight:800;color:var(--ok)}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.small{font-size:12px;color:var(--muted)}.beltlines{max-height:160px;overflow:auto;background:#020617;border:1px solid #1e293b;border-radius:10px;padding:8px}.count{font-weight:700;color:#bae6fd}.warnbox{background:#422006;border:1px solid #854d0e;color:#fde68a;border-radius:12px;padding:10px;margin:8px 0}
</style>
</head>
<body>
<header><h1>DQX 戦神のベルト検索ツール</h1><p class="note">冒険者の広場の「所持している戦神のベルト一覧」を丸ごと貼り付けて検索できます。スマホのタップ操作対応版です。</p></header>
<div class="wrap">
  <div class="tabs" role="tablist">
    <button type="button" class="active" data-tab="paste">ベルト貼り付け検索</button>
    <button type="button" data-tab="reverse">効果から逆引き</button>
    <button type="button" data-tab="db">ボスDB編集</button>
  </div>
  <section id="paste" class="grid">
    <div class="card">
      <h2>1. 広場コピーを貼り付け</h2>
      <textarea id="beltText" placeholder="冒険者の広場からコピーした一覧をそのまま貼り付け"></textarea>
      <div class="row">
        <button type="button" id="analyzeBtn">検索する</button>
        <button type="button" class="secondary" id="clearBtn">消す</button>
      </div>
      <p class="small">「ドラゴンクエストX - 目覚めし冒険者の広場」などの見出しが混ざっていても、戦神のベルト単位で読み取ります。</p>
    </div>
    <div class="card"><h2>2. 結果</h2><div id="results"><p>まだ検索していません。</p></div></div>
  </section>
  <section id="reverse" class="grid hidden">
    <div class="card"><h2>効果から使えるコンテンツを逆引き</h2><input id="effectQuery" placeholder="例：物質 / 雷 / ブーメラン / 魔法使い"><button type="button" id="reverseBtn">逆引きする</button><p class="small">種族・属性・武器・職業名で検索できます。</p></div>
    <div class="card"><h2>候補</h2><div id="reverseResults"><p>効果を入力してください。</p></div></div>
  </section>
  <section id="db" class="hidden card"><h2>ボスDB編集</h2><p class="small">この端末のブラウザに保存されます。JSONが壊れた場合は初期DBに戻してください。</p><textarea id="dbText" style="min-height:420px;font-family:ui-monospace,Menlo,monospace"></textarea><button type="button" id="saveDbBtn">DB保存</button><button type="button" class="secondary" id="resetDbBtn">初期DBに戻す</button></section>
</div>
<script>
(function(){
'use strict';
const INITIAL_BOSSES=[
{content:'常闇',boss:'常闇の竜レグナード',races:['ドラゴン'],goodElements:['炎'],jobs:['パラディン','魔法使い','魔法戦士','僧侶','天地雷鳴士'],weapons:['両手杖','片手剣','弓','スティック'],note:'ドラゴン系。魔法構成なら炎/両手杖＋ドラゴンが候補'},
{content:'常闇',boss:'ダークキング',races:['スライム'],goodElements:['等倍'],jobs:['まもの使い','バトルマスター','武闘家','どうぐ使い','僧侶'],weapons:['ムチ','片手剣','ヤリ','ブーメラン','スティック'],note:'スライム系。武器＋スライムを優先'},
{content:'常闇',boss:'海冥主メイヴ',races:['水'],goodElements:['雷'],jobs:['まもの使い','武闘家','バトルマスター','どうぐ使い','僧侶'],weapons:['ムチ','ヤリ','片手剣','ブーメラン','スティック'],note:'水系。雷＋水系が候補'},
{content:'聖守護者',boss:'冥骸魔レギルラッゾ＆獣魔ローガスト',races:['ゾンビ','けもの'],goodElements:['炎','土','光'],jobs:['天地雷鳴士','僧侶','占い師'],weapons:['扇','スティック','弓','ツメ'],note:'ゾンビ/けものの複合'},
{content:'聖守護者',boss:'紅殻魔スコルパイド',races:['虫'],goodElements:['等倍'],jobs:['まもの使い','バトルマスター','武闘家','賢者','どうぐ使い'],weapons:['ムチ','片手剣','ヤリ','ブーメラン','扇'],note:'虫系。前衛武器＋虫が候補'},
{content:'聖守護者',boss:'翠将鬼ジェルザーク',races:['怪人'],goodElements:['炎','氷'],jobs:['魔法使い','魔法戦士','僧侶','レンジャー','天地雷鳴士'],weapons:['両手杖','片手剣','弓','スティック','ブーメラン'],note:'怪人系。炎/氷＋両手杖が候補'},
{content:'聖守護者',boss:'剛獣鬼ガルドドン',races:['けもの'],goodElements:['闇','光'],jobs:['海賊','デスマスター','賢者','魔法戦士','魔法使い','パラディン'],weapons:['ブーメラン','鎌','両手杖','片手剣','弓'],note:'けもの系。構成により闇/光や武器を調整'},
{content:'聖守護者',boss:'邪蒼鎧デルメゼ',races:['物質'],goodElements:['等倍'],jobs:['まもの使い','武闘家','レンジャー','僧侶','賢者'],weapons:['ムチ','ヤリ','ブーメラン','スティック','扇'],note:'物質系。ムチ/ヤリ/ブメ＋物質が候補'},
{content:'聖守護者',boss:'羅刹王バラシュナ',races:['ドラゴン'],goodElements:['炎'],jobs:['魔法使い','賢者','僧侶','天地雷鳴士','竜術士'],weapons:['両手杖','扇','スティック','鎌'],note:'ドラゴン系。炎/両手杖＋ドラゴンが候補'},
{content:'咎人',boss:'厭悪のルベランギス',races:['鳥'],goodElements:['等倍'],jobs:['武闘家','バトルマスター','レンジャー','僧侶','賢者'],weapons:['ヤリ','片手剣','ブーメラン','スティック','扇'],note:'鳥系'},
{content:'咎人',boss:'絶念のアウルモッド',races:['あくま'],goodElements:['等倍'],jobs:['踊り子','バトルマスター','魔剣士','レンジャー','僧侶','賢者'],weapons:['短剣','片手剣','鎌','ブーメラン','スティック','扇'],note:'あくま系'},
{content:'咎人',boss:'凶禍のフラウソン',races:['エレメント'],goodElements:['炎','氷'],jobs:['魔剣士','ガーディアン','賢者','僧侶','パラディン'],weapons:['鎌','片手剣','両手剣','ブーメラン','スティック'],note:'エレメント系。炎/氷候補'},
{content:'咎人',boss:'悲愴のウィリーデ',races:['マシン'],goodElements:['炎','土'],jobs:['竜術士','魔法使い','賢者','海賊','僧侶'],weapons:['両手杖','鎌','ブーメラン','スティック','弓'],note:'マシン系。炎/土候補'},
{content:'咎人',boss:'燦滅のノクゼリア',races:['植物'],goodElements:['等倍'],jobs:['武闘家','バトルマスター','レンジャー','僧侶','賢者'],weapons:['ヤリ','片手剣','ブーメラン','スティック','扇'],note:'植物系。種族・攻撃系を優先'}
];
let bosses=loadBosses();
const raceWords=['スライム','けもの','獣','ドラゴン','虫','鳥','植物','ゾンビ','あくま','悪魔','エレメント','怪人','物質','マシン','水'];
const elements=['炎','氷','風','雷','土','光','闇'];
const weapons=['片手剣','両手剣','短剣','スティック','両手杖','ヤリ','オノ','棍','ツメ','ムチ','扇','ハンマー','ブーメラン','弓','鎌'];
function $(id){return document.getElementById(id)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').replace(/獣/g,'けもの').replace(/悪魔/g,'あくま').replace(/右手に/g,'').replace(/装備時/g,'').replace(/装備/g,'').replace(/\s+/g,'').toLowerCase()}
function loadBosses(){try{return JSON.parse(localStorage.getItem('dqxBeltBossDbMobile')||'null')||INITIAL_BOSSES}catch(e){return INITIAL_BOSSES}}
function splitBelts(text){const starts=[...String(text||'').matchAll(/戦神のベルト\+?\d*/g)].map(m=>m.index); if(!starts.length)return[]; const blocks=[]; for(let i=0;i<starts.length;i++){const start=starts[i], end=i+1<starts.length?starts[i+1]:text.length; blocks.push(text.slice(start,end).trim())} return blocks.filter(Boolean)}
function parseBelt(block,i){const n=norm(block);return {id:i+1,raw:block,races:raceWords.filter(r=>n.includes(norm(r))).map(r=>r==='獣'?'けもの':r==='悪魔'?'あくま':r).filter((v,i,a)=>a.indexOf(v)===i),elements:elements.filter(e=>block.includes(e+'属性')||block.includes(e+'攻撃')||block.includes(e+'ダメージ')||block.includes(e)),weapons:weapons.filter(w=>n.includes(norm(w))),atk:/こうげき力\s*\+|攻撃力\s*\+/.test(block),matk:/こうげき魔力|攻撃魔力|攻魔/.test(block),crit:/会心率|呪文暴走率/.test(block),lines:block.split(/\n/).map(x=>x.trim()).filter(Boolean)}}
function matchBelt(b,boss){let score=0,reasons=[];const br=boss.races.map(norm),be=boss.goodElements.map(norm),bw=boss.weapons.map(norm);const raceHits=b.races.filter(r=>br.includes(norm(r)));if(raceHits.length){score+=60;reasons.push('種族一致: '+raceHits.join('/'))}const elemHits=b.elements.filter(e=>be.some(x=>x.includes(norm(e))));if(elemHits.length){score+=20;reasons.push('属性候補: '+elemHits.join('/'))}const weapHits=b.weapons.filter(w=>bw.includes(norm(w)));if(weapHits.length){score+=15;reasons.push('武器候補: '+weapHits.join('/'))}if(b.atk&&boss.jobs.some(j=>['まもの使い','バトルマスター','武闘家','魔剣士','レンジャー','海賊','ガーディアン','踊り子'].includes(j))){score+=8;reasons.push('こうげき力が物理職と相性あり')}if(b.matk&&boss.jobs.some(j=>['魔法使い','竜術士','賢者','天地雷鳴士','デスマスター'].includes(j))){score+=8;reasons.push('こうげき魔力が魔法職と相性あり')}if(b.crit){score+=4;reasons.push('会心/暴走系の汎用加点')}return{score,reasons}}
function renderResults(){const text=$('beltText').value;const belts=splitBelts(text).map(parseBelt);const out=$('results');if(!belts.length){out.innerHTML='<div class="warnbox">戦神のベルトが読み取れませんでした。広場コピー内に「戦神のベルト+5」のような行があるか確認してください。</div>';return}let html='<p><span class="count">'+belts.length+'</span> 個のベルトを読み取りました。</p>';belts.forEach(b=>{const ms=bosses.map(x=>({boss:x,...matchBelt(b,x)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);html+='<div class="boss"><h3>ベルト '+b.id+' <span class="tag">'+esc([b.weapons.join('/'),b.races.join('/'),b.elements.join('/')].filter(Boolean).join(' / ')||'効果読み取り')+'</span></h3><div class="beltlines small">'+b.lines.map(esc).join('<br>')+'</div>';if(!ms.length){html+='<p>ハイエンド用の明確な一致は少なめです。汎用・邪神・防衛軍用として確認してください。</p>'}else{html+='<table><tr><th>点</th><th>候補</th><th>理由</th><th>職/メモ</th></tr>';ms.slice(0,8).forEach(m=>{html+='<tr><td class="score">'+m.score+'</td><td>'+esc(m.boss.content)+'<br><b>'+esc(m.boss.boss)+'</b></td><td>'+esc(m.reasons.join('\n')).replace(/\n/g,'<br>')+'</td><td>'+esc(m.boss.jobs.join('、'))+'<br><span class="small">'+esc(m.boss.note)+'</span></td></tr>'});html+='</table>'}html+='</div>'});out.innerHTML=html;out.scrollIntoView({behavior:'smooth',block:'start'})}
function reverseSearch(){const q=norm($('effectQuery').value);const out=$('reverseResults');if(!q){out.innerHTML='<p>効果を入力してください。</p>';return}const hits=bosses.filter(b=>norm([b.content,b.boss,b.races.join(' '),b.goodElements.join(' '),b.jobs.join(' '),b.weapons.join(' '),b.note].join(' ')).includes(q));out.innerHTML=hits.length?hits.map(b=>'<div class="boss"><b>'+esc(b.content+'：'+b.boss)+'</b><br>'+b.races.map(r=>'<span class="pill hit">'+esc(r)+'</span>').join('')+b.goodElements.map(e=>'<span class="pill maybe">'+esc(e)+'</span>').join('')+'<p>適正職候補：'+esc(b.jobs.join('、'))+'</p><p class="small">武器：'+esc(b.weapons.join('、'))+' / '+esc(b.note)+'</p></div>').join(''):'<p>該当なし。表記を変えて検索してください。</p>'}
function init(){document.querySelectorAll('.tabs button').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));$(btn.dataset.tab).classList.remove('hidden')},{passive:true})});$('analyzeBtn').addEventListener('click',renderResults);$('reverseBtn').addEventListener('click',reverseSearch);$('clearBtn').addEventListener('click',()=>{$('beltText').value='';$('results').innerHTML='<p>まだ検索していません。</p>'});$('effectQuery').addEventListener('keydown',e=>{if(e.key==='Enter')reverseSearch()});$('dbText').value=JSON.stringify(bosses,null,2);$('saveDbBtn').addEventListener('click',()=>{try{bosses=JSON.parse($('dbText').value);localStorage.setItem('dqxBeltBossDbMobile',JSON.stringify(bosses));alert('保存しました')}catch(e){alert('JSONエラー: '+e.message)}});$('resetDbBtn').addEventListener('click',()=>{bosses=INITIAL_BOSSES;localStorage.removeItem('dqxBeltBossDbMobile');$('dbText').value=JSON.stringify(bosses,null,2);alert('初期DBに戻しました')})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
